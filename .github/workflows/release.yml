# ============================================================================
# 🚀 Automated Semantic Release
# ============================================================================
# Chain: CI → Release (tag + GitHub release + Cargo.toml bump) → a `workflow_dispatch` run of
# this same workflow with `publish_version` set → crates.io publish (via the `crates-io`
# environment and Trusted Publishing; no registry token is stored here).
#
# The publish step cannot run in the `workflow_run`-triggered release run itself: crates.io
# refuses Trusted Publishing tokens from `workflow_run` (and `pull_request_target`) runs. The
# dispatched run is a `workflow_dispatch` on master, which crates.io accepts and the
# `crates-io` environment's master-only branch policy allows. `GITHUB_TOKEN` may create
# `workflow_dispatch` events, unlike most others.
# ============================================================================

name: 🚀 Release

on:
  workflow_run:
    workflows: ["🧪 CI Pipeline"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "🧪 Dry-run mode (no actual release; with publish_version, `cargo publish --dry-run`)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_version:
        description: "📦 Publish the existing tag v<version> to crates.io instead of releasing (e.g. 3.0.1)"
        required: false
        default: ""
        type: string

# A publish run gets its own group: it is dispatched while the release run that dispatched it
# still holds `release`, and a pending run in a group is cancelled when another one queues.
concurrency:
  group: ${{ github.event.inputs.publish_version && format('publish-{0}', github.event.inputs.publish_version) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: 🚀 Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'workflow_dispatch' && !github.event.inputs.publish_version) ||
      (github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release)'))
    # The arsenal action reports a release by comparing the `VERSION` file before and after
    # semantic-release runs; `.releaserc.json`'s prepareCmd rewrites it. Without that file it
    # reports `released=false` with an empty version, and the publish is never dispatched.
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: 🦀 Setup Rust (for `cargo update` in prepareCmd)
        uses: dtolnay/rust-toolchain@stable
      # semantic-release's prepareCmd runs `cargo update -p rusteero --offline` to refresh the
      # lockfile after it rewrites the version. `--offline` keeps that deterministic, but a fresh
      # runner has no registry index, so resolution fails with "no matching package named
      # `bytes`". Populate the cache first and the offline update resolves from it.
      - name: 📦 Prime the cargo registry cache
        run: cargo fetch --locked
      - name: 📍 Record HEAD before semantic-release
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 🚀 Run semantic-release
        id: release
        uses: fulviofreitas/workflow-arsenal/.github/actions/semantic-release@master
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
      # @semantic-release/git commits the release locally before pushing it, so HEAD moves exactly
      # when a release is cut. If the action still reports no release, the publish would be
      # skipped without any failure, which is how v3.0.0 never reached crates.io.
      - name: 🛑 Fail if a release was cut but not reported
        if: github.event.inputs.dry_run != 'true'
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ] && [ "$RELEASED" != "true" ]; then
            echo "::error::A release was cut but the action reported released='$RELEASED'." \
              "Dispatch this workflow with publish_version to publish the new tag."
            exit 1
          fi
      # semantic-release pushes the tag before its GitHub-release and success steps; if one of those
      # fails, the job is red but nothing above dispatches the publish, and "Re-run failed jobs"
      # would finish green without publishing.
      - name: 🧭 Name a tag that was pushed before semantic-release failed
        if: failure() && steps.release.outcome == 'failure'
        env:
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ] && [ -n "$tag" ] &&
            [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::$tag was pushed, but semantic-release failed afterwards, so it was not" \
              "published. Do not re-run this job; dispatch this workflow with publish_version=${tag#v}."
          fi

  dispatch-publish:
    name: 📨 Dispatch the crates.io publish
    runs-on: ubuntu-latest
    needs: release
    if: |
      success() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.version != '' &&
      github.event.inputs.dry_run != 'true'
    timeout-minutes: 30
    permissions:
      actions: write # create the workflow_dispatch event and watch the run it starts
    steps:
      # The dispatched run is started by github-actions[bot], so nobody is notified when it fails.
      # Waiting for it makes a failed publish fail this run, which its triggering actor does see.
      - name: 📨 Dispatch this workflow with publish_version and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          run=$(jq -n --arg v "$VERSION" \
              '{ref: "master", inputs: {publish_version: $v}, return_run_details: true}' |
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data @- \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches")
          id=$(jq -er '.workflow_run_id' <<<"$run")
          echo "Publish of v${VERSION}: $(jq -r '.html_url' <<<"$run")" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  publish-crates-io:
    name: 📦 Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_version != ''
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/rusteero
    permissions:
      id-token: write # crates.io Trusted Publishing (OIDC)
      contents: read
    env:
      VERSION: ${{ github.event.inputs.publish_version }}
    steps:
      - name: 🔎 Validate publish_version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::publish_version must be a bare semver version such as 3.0.1 (no leading v)."
            exit 1
          fi
      # Build the tagged release commit, never whatever master points at. `refs/tags/` keeps a
      # branch that happens to be named `v<version>` from being checked out instead.
      - name: 📥 Checkout v${{ github.event.inputs.publish_version }}
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ github.event.inputs.publish_version }}
          fetch-depth: 0
          persist-credentials: false
      # The environment's branch policy is checked against this run's ref (master), not the tag,
      # so check here that the tagged commit is on master and carries the requested version.
      - name: 🔎 Check the tagged commit
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::v$VERSION is not on master."
            exit 1
          fi
          tagged=$(sed -n '0,/^version = /s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$tagged" != "$VERSION" ]; then
            echo "::error::Cargo.toml at v$VERSION says version \"$tagged\"."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::crates.io records $GITHUB_SHA (master when this run started) as the" \
              "source commit; the crate is built from v$VERSION at $(git rev-parse HEAD)."
          fi
      # This job can mint a crates.io token, so its third-party actions are pinned to commits.
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-24
        with:
          toolchain: stable
      # Also runs on a dry run: the token exchange is the step that proves the Trusted Publishing
      # entry matches, and the action revokes the short-lived token when the job ends.
      - name: 🔑 Authenticate with crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: 📤 cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
