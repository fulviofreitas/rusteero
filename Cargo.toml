[package]
name = "rusteero"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
description = "Async Rust client for the Eero (Amazon) mesh Wi-Fi cloud API — a port of the Python eero-api library"
license = "MIT"
repository = "https://github.com/fulviofreitas/rusteero"
homepage = "https://github.com/fulviofreitas/rusteero"
documentation = "https://docs.rs/rusteero"
readme = "README.md"
keywords = ["eero", "mesh", "wifi", "router", "api-client"]
categories = ["api-bindings", "network-programming"]
# Not published yet — decision D-15: no publish of any kind until live validation.
publish = false
exclude = ["/.github", "/wiki", "/PARITY.md", "/PORT-REPORT.md", "/CHANGELOG.md", "/commitlint.config.js", "/.releaserc.json"]

[features]
default = ["keyring"]
keyring = ["dep:keyring"]
typed = []

[dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
secrecy = { version = "0.10", features = ["serde"] }
tracing = "0.1"
url = "2.5"
bytes = "1.12"
keyring = { version = "4.2", optional = true }
jiff = "0.2.35"

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
wiremock = "0.6"
tempfile = "3"
rstest = "0.27"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
